<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121827">
<title>投資經理人</title>
<style>
  :root{
    --bg:#121827; --panel:#1a2236; --card:#1f2840; --line:#2e3956;
    --ink:#eef1f8; --muted:#8e98b3; --dim:#5f6a86;
    --lev:#f0913a; --lev-bg:#2d2620; --lev-line:#7a5530;
    --cash:#3b82f6; --cash-bg:#1b2747; --cash-line:#2f5aa8;
    --ori:#a78bfa; --ori-bg:#262347; --ori-line:#5b4d9e;
    --teal:#5fd4c0; --red:#ff6b5e; --green:#43c47b; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 0 10px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:21px;margin:0;font-weight:800}
  .sub{color:var(--muted);font-size:13px}
  .iconbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--teal);font-size:20px;cursor:pointer}
  .mkt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .mkt .px{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .live.on i{background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,196,123,.6)}70%{box-shadow:0 0 0 7px rgba(67,196,123,0)}100%{box-shadow:0 0 0 0 rgba(67,196,123,0)}}
  .seg{display:flex;background:var(--panel);border-radius:99px;padding:4px;margin-top:10px}
  .seg button{flex:1;border:0;border-radius:99px;background:transparent;color:var(--muted);padding:8px 0;font-size:15px;font-family:inherit;cursor:pointer}
  .seg button.on{background:#4a5470;color:var(--ink);font-weight:700}

  .beta{background:var(--panel);border-radius:var(--radius);padding:14px 16px;margin-top:12px}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .mid{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;margin-top:8px}
  .chip.ok{background:rgba(67,196,123,.15);color:var(--green)}
  .chip.go{background:rgba(255,107,94,.15);color:var(--red)}
  .meter{position:relative;height:10px;border-radius:99px;background:var(--line);margin:14px 2px 4px}
  .meter .z{position:absolute;top:0;bottom:0;background:rgba(95,212,192,.25);border:1.5px solid var(--teal);border-radius:99px}
  .meter .p{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-50%);transition:left .4s}
  .mticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .gcard{border-radius:var(--radius);padding:12px 14px;border:1.5px solid}
  .gcard.lev{background:var(--lev-bg);border-color:var(--lev-line)}
  .gcard.cash{background:var(--cash-bg);border-color:var(--cash-line)}
  .gcard.ori{background:var(--ori-bg);border-color:var(--ori-line);grid-column:1 / -1}
  .gtop{display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .pct{font-weight:800;font-size:18px}
  .kv{font-size:13px;color:var(--muted);margin-top:3px}
  .kv b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;margin-left:4px}
  .need{margin-top:6px;font-size:13px;font-weight:700}
  .need .amt{display:block;font-size:21px;font-variant-numeric:tabular-nums}
  .need.up{color:var(--red)} .need.down{color:var(--green)} .need.zero{color:var(--muted)}
  .gfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
  .act{margin-top:8px;width:100%;border:0;border-radius:12px;padding:9px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.08);color:var(--ink)}

  .sec{display:flex;justify-content:space-between;align-items:flex-end;margin:20px 2px 8px}
  .sec .t{font-size:17px;font-weight:700}
  .slabels{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:0 4px 4px}
  .track{position:relative;height:48px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
  .bar{position:absolute;left:0;right:0;top:14px;height:20px;border-radius:99px;overflow:hidden;display:flex;pointer-events:none}
  .bar .l{background:var(--lev)} .bar .c{flex:1;background:var(--cash)}
  .knob{position:absolute;top:2px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#1f2840;border:3px solid var(--teal);box-shadow:0 2px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:800;pointer-events:none}
  .track.drag .knob{transform:scale(1.12)}
  .hint{color:var(--muted);font-size:13px;margin-top:6px}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font-size:15px;font-family:inherit;cursor:pointer}
  .btn.p{background:var(--teal);border-color:var(--teal);color:#0f1a1f;font-weight:800}
  .btn:disabled{opacity:.45}

  .panel{background:var(--panel);border-radius:var(--radius);padding:14px 16px;margin-top:10px}
  .injrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
  .track.thin{height:40px}
  .track.thin .bar{top:16px;height:8px;background:var(--line)}
  .track.thin .bar .l{background:var(--teal)}
  .track.thin .knob{top:6px;width:28px;height:28px;margin-left:-14px;background:#fff;border:0}
  .injout{margin-top:8px;font-size:15px}
  .injout b{font-variant-numeric:tabular-nums}

  .group{border-radius:var(--radius);border:1.5px solid;padding:14px;margin-top:12px}
  .group.lev{border-color:var(--lev-line)} .group.cash{border-color:var(--cash-line)} .group.ori{border-color:var(--ori-line)}
  .group h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{border-radius:99px;padding:7px 14px;border:1.5px solid;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);background:transparent}
  .group.lev .pill{border-color:var(--lev-line);background:var(--lev-bg)}
  .group.cash .pill{border-color:var(--cash-line);background:var(--cash-bg)}
  .group.ori .pill{border-color:var(--ori-line);background:var(--ori-bg)}
  .pill .nm{font-weight:700;font-size:15px}
  .pill .vl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pill .ch{font-size:12px;margin-left:4px}
  .add{margin-top:10px;border:0;border-radius:99px;padding:8px 16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .group.lev .add{background:var(--lev-bg);color:var(--lev)}
  .group.ori .add{background:var(--ori-bg);color:var(--ori)}
  .up{color:var(--red)} .down{color:var(--green)}
  .flash{animation:fl 1s}
  @keyframes fl{0%{background:rgba(95,212,192,.25)}100%{background:transparent}}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#0e1422;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;border:0;background:transparent;color:var(--dim);padding:10px 0 12px;font-size:12px;font-family:inherit;cursor:pointer}
  .tabbar button .i{display:block;font-size:22px;line-height:1.2}
  .tabbar button.on{color:var(--teal);font-weight:700}

  pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15px;margin:0}
  label{display:block;font-weight:700;margin-top:14px}
  .help{display:block;font-weight:400;color:var(--muted);font-size:13px}
  input.f{width:100%;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;margin-top:5px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700}
  .chk input{transform:scale(1.25)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h3{margin:0 0 4px;font-size:19px}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:30;max-width:90%;font-weight:700}
  .loading{text-align:center;color:var(--muted);padding:60px 0}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
  .warn{background:rgba(255,107,94,.12);color:#ffb1a9;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
  .muted{color:var(--muted)}
  .ol{background:linear-gradient(135deg,#1d2a44,#1a2236);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:12px}
  .ol .hd{display:flex;justify-content:space-between;align-items:center}
  .ol .lab{font-size:19px;font-weight:800}
  .ol .est{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .ol .us{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .ol .us div{background:rgba(255,255,255,.04);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--muted)}
  .ol .us b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .ol ul{margin:8px 0 0;padding-left:18px} .ol li{margin:3px 0;font-size:14px}
  .ol .tips{background:rgba(95,212,192,.08);border-radius:12px;padding:10px 12px;margin-top:10px}
  .ol .tips b{color:var(--teal)}
  .lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .lv span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
  .news a{color:var(--ink);text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <div>
        <div class="mkt"><h1>資產再平衡</h1><span class="live" id="live"><i></i><span id="liveTxt">連線中</span></span></div>
        <div class="mkt"><span class="sub">加權指數</span><span class="px" id="idxPx">—</span><span id="idxChg" class="sub"></span></div>
      </div>
      <button class="iconbtn" id="refresh" onclick="load()" aria-label="重新整理">⟳</button>
    </div>
    <div class="seg" id="mode">
      <button class="on" data-m="value">現值再平衡</button>
      <button data-m="cost">成本檢視</button>
    </div>
  </header>

  <section id="login" class="panel" style="display:none;margin-top:30px">
    <h3 style="margin-top:0">請輸入網頁密碼</h3>
    <input class="f" id="pin" type="password" inputmode="numeric" placeholder="程式裡 WEB_PIN 的密碼">
    <div class="row"><button class="btn p" onclick="doLogin()">進入</button></div>
  </section>

  <section id="pg-main" class="page"></section>
  <section id="pg-report" class="page" style="display:none"></section>
  <section id="pg-set" class="page" style="display:none"></section>
</div>

<nav class="tabbar" id="tabbar">
  <button class="on" data-p="main"><span class="i">⚖️</span>再平衡</button>
  <button data-p="report"><span class="i">📄</span>報告</button>
  <button data-p="set"><span class="i">⚙️</span>設定</button>
</nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
var PIN = '', D = null, MODE = 'value', PREVIEW = null, INJ = 0, DRAGGING = false, LIVE_T = null, LIVE_BUSY = false;
var LIVE_MS = 60000;
try { PIN = localStorage.getItem('tm_pin') || ''; } catch (e) {}
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function comma(n, d){ if (!isFinite(n)) return '—'; d = d || 0; var p = Math.abs(n).toFixed(d).split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (n < 0 ? '-' : '') + p.join('.'); }
function pct(x, d){ return isFinite(x) ? (x * 100).toFixed(d == null ? 0 : d) + '%' : '—'; }
function wan(v){ return !isFinite(v) ? '—' : Math.abs(v) >= 10000 ? (v / 10000).toFixed(1).replace(/\.0$/, '') + ' 萬' : comma(v); }
function toast(m){ var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display = 'none'; }, 3000); }
function call(fn, args, ok, fail){
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){
    var m = (e && e.message) || String(e);
    if (/密碼/.test(m)) { try { localStorage.removeItem('tm_pin'); } catch (x) {} PIN = ''; showLogin(); }
    if (fn !== 'apiLive') toast('⚠️ ' + m);
    if (fail) fail(m);
  });
  r[fn].apply(r, [PIN].concat(args || []));
}
function showLogin(){ $('login').style.display = 'block'; document.querySelectorAll('.page').forEach(function(p){ p.style.display = 'none'; }); }
function doLogin(){
  PIN = $('pin').value.trim();
  google.script.run.withSuccessHandler(function(){
    try { localStorage.setItem('tm_pin', PIN); } catch (e) {}
    $('login').style.display = 'none'; go('main'); load();
  }).withFailureHandler(function(e){ toast('⚠️ ' + (e.message || e)); }).apiLogin(PIN);
}
document.querySelectorAll('#tabbar button').forEach(function(b){ b.onclick = function(){ go(b.dataset.p); }; });
function go(p){
  document.querySelectorAll('#tabbar button').forEach(function(x){ x.classList.toggle('on', x.dataset.p === p); });
  document.querySelectorAll('.page').forEach(function(x){ x.style.display = 'none'; });
  $('pg-' + p).style.display = 'block';
  $('mode').style.display = p === 'main' ? 'flex' : 'none';
}
document.querySelectorAll('#mode button').forEach(function(b){
  b.onclick = function(){
    MODE = b.dataset.m;
    document.querySelectorAll('#mode button').forEach(function(x){ x.classList.toggle('on', x === b); });
    buildMain();
  };
});

/* ===== 載入 ===== */
function load(){
  if (!PIN) { showLogin(); return; }
  $('refresh').disabled = true;
  $('pg-main').innerHTML = '<div class="loading"><div class="spin"></div>正在抓最新價格…</div>';
  call('apiDashboard', [], function(d){
    $('refresh').disabled = false; D = d; PREVIEW = null; INJ = 0;
    if (d.market) setIndex(d.market.price, d.market.price / (1 + d.market.chg));
    buildMain(); renderReport(); renderSet(); startLive();
  }, function(){ $('refresh').disabled = false; $('pg-main').innerHTML = '<div class="panel">讀取失敗，請按右上角 ⟳ 再試。</div>'; });
}

/* ===== 每分鐘即時報價 ===== */
function startLive(){
  clearInterval(LIVE_T);
  LIVE_T = setInterval(tickLive, LIVE_MS);
  setLive('on', '即時');
}
function setLive(state, txt){ $('live').className = 'live' + (state === 'on' ? ' on' : ''); $('liveTxt').textContent = txt; }
function setIndex(px, prev){
  $('idxPx').textContent = comma(px, 2);
  if (prev > 0) {
    var ch = px - prev, r = ch / prev;
    $('idxChg').innerHTML = '<span class="' + (ch >= 0 ? 'up' : 'down') + '" style="font-weight:700">' + (ch >= 0 ? '▲' : '▼') + comma(Math.abs(ch), 2) + '（' + (Math.abs(r) * 100).toFixed(2) + '%）</span>';
  }
}
function tickLive(){
  if (!D || LIVE_BUSY || document.hidden) return;
  LIVE_BUSY = true;
  call('apiLive', [], function(r){
    LIVE_BUSY = false;
    if (!r || !r.ok) { setLive('off', '報價暫停'); return; }
    var open = r.index && r.index.date === r.today && (r.index.time || '') < '13:31';
    setLive(open ? 'on' : 'off', (open ? '即時 ' : '休市 ') + r.serverTime.substr(0, 5));
    if (r.index) setIndex(r.index.price, r.index.prev);
    if (r.fx) D.fx = r.fx;
    (D.items || []).forEach(function(x){
      var q = r.quotes[x.code]; if (!q || !(q.price > 0)) return;
      x.price = q.price; if (q.prev > 0) x.prev = q.prev;
      var fx = x.us ? (D.fx || 0) : 1;
      x.value = x.shares * x.price * fx;
      x.pnl = x.cost > 0 ? (x.price - x.cost) * x.shares * fx : NaN;
    });
    if (r.quotes[D.tradeCode]) D.tradePrice = r.quotes[D.tradeCode].price;
    if (!DRAGGING) { refresh(true); }
  }, function(){ LIVE_BUSY = false; setLive('off', '報價暫停'); });
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden && D) tickLive(); });

/* ===== 核心計算 ===== */
function groups(){
  var lev = [], ori = [], useCost = MODE === 'cost';
  (D.items || []).forEach(function(x){ (x.mult >= 2 ? lev : ori).push(x); });
  function val(x){ return useCost && x.cost > 0 ? x.cost * x.shares * (x.us && D.fx ? D.fx : 1) : x.value; }
  var L = 0, levExp = 0, O = 0, Eo = 0;
  lev.forEach(function(x){ L += val(x); levExp += val(x) * x.mult; });
  ori.forEach(function(x){ O += val(x); Eo += val(x) * x.mult; });
  var C = Number(D.holdings.cash) || 0;
  return { lev: lev, ori: ori, L: L, levExp: levExp, levMult: L > 0 ? levExp / L : 2, O: O, Eo: Eo, C: C, A: L + O + C, val: val };
}
function compute(){
  var g = groups(), S = D.settings, band = Number(S.band) / 100, m = g.levMult;
  var pool = g.L + g.C, expo = g.Eo + g.levExp;
  var beta = g.A > 0 ? expo / g.A : NaN;
  var Tsaved = Number(S.targetBeta), T = PREVIEW != null ? PREVIEW : Tsaved;
  var X0 = Math.min(Math.max((T * g.A - g.Eo) / m, 0), pool);
  var v = pool > 0 ? X0 / pool : 0;
  var N = INJ, A2 = g.A + N, pool2 = pool + N, X = v * pool2, cashT = pool2 - X;
  return {
    g: g, beta: beta, expo: expo, T: T, Tsaved: Tsaved, v: v, X: X, cashT: cashT, N: N, A2: A2,
    gapLev: X - g.L, dn: T * (1 - band), up: T * (1 + band),
    triggered: beta > T * (1 + band) || beta < T * (1 - band),
    firewall: (Number(S.annualExpense) || 0) * (D.firewallYears || 4),
    Tnew: A2 > 0 ? (g.Eo + m * X) / A2 : NaN
  };
}

/* ===== 畫面：骨架只建一次，數字用 refresh() 更新（拖曳不會中斷） ===== */
function buildMain(){
  if (!D) return;
  var isCost = MODE === 'cost', h = '';
  h += '<div id="topArea"></div><div id="olArea"></div>';
  if (!isCost) {
    h += '<div class="sec"><span class="t">拖曳調整目標比例</span><span class="sub">目標 Beta <b id="tB" style="color:var(--ink);font-size:18px"></b></span></div>' +
         '<div class="slabels"><span id="lbL" style="color:var(--lev)"></span><span id="lbC" style="color:var(--cash)"></span></div>' +
         '<div class="track" id="trk"><div class="bar"><div class="l" id="barL"></div><div class="c"></div></div><div class="knob" id="knob">↔</div></div>' +
         '<div class="hint" id="slHint"></div>' +
         '<div class="row"><button class="btn" onclick="presetT(0.6)">新手 0.6</button><button class="btn" onclick="presetT(1)">1.0</button><button class="btn" onclick="presetT(1.2)">標準 1.2</button></div>' +
         '<div id="saveRow"></div>';
    h += '<div class="panel"><div style="font-weight:700">⊕ 新資金注入</div>' +
         '<div class="injrow" style="margin-top:6px"><span id="injLab">未注入</span><span id="injMax"></span></div>' +

// 自製拖曳：手指／滑鼠都能拖，也能點一下跳過去
function makeDrag(el, onFrac){
  function frac(e){
    var r = el.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.min(1, Math.max(0, x / r.width));
  }
  function start(e){ DRAGGING = true; el.classList.add('drag'); onFrac(frac(e)); e.preventDefault(); }
  function move(e){ if (!DRAGGING || !el.classList.contains('drag')) return; onFrac(frac(e)); e.preventDefault(); }
  function end(){ if (!el.classList.contains('drag')) return; el.classList.remove('drag'); DRAGGING = false; refresh(); }
  el.addEventListener('pointerdown', function(e){ el.setPointerCapture && el.setPointerCapture(e.pointerId); start(e); });
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function setTargetFromFrac(f){
  var g = groups(), pool = g.L + g.C;
  f = Math.round(f * 100) / 100;
  PREVIEW = g.A > 0 ? Math.round((g.Eo + g.levMult * f * pool) / g.A * 100) / 100 : 1.2;
  refresh();
}
function injMax(){ var g = groups(); return Math.max(100000, Math.ceil(g.A * 0.5 / 10000) * 10000); }

function refresh(flash){

    (isCost ? '<span class="chip ok">成本檢視（只供參考）</span>' : c.triggered ? '<span class="chip go">已超出範圍：建議調整</span>' : '<span class="chip ok">在範圍內：可以不動</span>') +

       '<div class="gfoot"><span>曝險 ' + wan(g.levExp) + '</span><span>實際 ' + pct(g.L / g.A) + '</span></div>' +

  t += '<div class="gcard cash"><div class="gtop"><span><span class="dot" style="background:var(--cash)"></span>現金</span><span class="pct" style="color:var(--cash)">' + pct(isCost ? g.C / A : c.cashT / A) + '</span></div>' +

  if (g.ori.length) {

  $('topArea').innerHTML = t;

  /* 拖曳區 */

        '<div class="row"><button class="btn p" onclick="commitInject(' + c.N + ')">💰 已存入，加到現金</button></div>';

  var s = D.settings;
  $('pg-set').innerHTML = '<div class="panel" style="margin-top:12px">' +
    '<label>一年生活費（元）<span class="help">⭐ 唯一必填：系統會保留 ' + (D.firewallYears || 4) + ' 年份現金當防火牆，買正二絕不動用</span><input class="f" id="s_annualExpense" type="number" value="' + s.annualExpense + '"></label>' +
    '<label>目標 Beta<span class="help">也可以在「再平衡」頁拖曳設定。1.2＝60% 正二＋40% 現金</span><input class="f" id="s_targetBeta" type="number" step="0.05" value="' + s.targetBeta + '"></label>' +
    '<label>觸發範圍 ±%<span class="help">10＝目標 1.2 時，1.08～1.32 之間不動</span><input class="f" id="s_band" type="number" value="' + s.band + '"></label>' +
    '<label>手續費折數 %<span class="help">6 折填 60</span><input class="f" id="s_feeDiscount" type="number" value="' + s.feeDiscount + '"></label>' +
    '<label>最小交易股數<span class="help">可買零股填 1；只買整張填 1000</span><input class="f" id="s_lot" type="number" value="' + s.lot + '"></label>' +
    '<div class="chk"><input id="s_pushPremarket" type="checkbox"' + (s.pushPremarket ? ' checked' : '') + '>早上約 8 點推播「盤前展望」（美股＋消息面）</div>' +
    '<div class="chk"><input id="s_pushIntraday" type="checkbox"' + (s.pushIntraday ? ' checked' : '') + '>盤中約 11 點推播到 LINE</div>' +
    '<div class="chk"><input id="s_pushClose" type="checkbox"' + (s.pushClose ? ' checked' : '') + '>盤後約 16 點推播到 LINE</div>' +
    '<div class="chk"><input id="s_pushOnlyAction" type="checkbox"' + (s.pushOnlyAction ? ' checked' : '') + '>只有要買賣時才推播</div>' +
    '<div class="row" style="margin-top:16px"><button class="btn p" onclick="saveSet(this)">💾 儲存</button></div></div>' +
    '<div class="hint" style="margin:12px 2px">📱 加到手機桌面：iPhone 用 Safari 打開 → 分享 → 加入主畫面。</div>';
}
function saveSet(btn){
  var o = {};
  ['annualExpense','targetBeta','band','feeDiscount','lot'].forEach(function(k){ o[k] = $('s_' + k).value; });
  ['pushPremarket','pushIntraday','pushClose','pushOnlyAction'].forEach(function(k){ o[k] = $('s_' + k).checked; });
  btn.disabled = true;
  call('apiSaveSettings', [o], function(r){ btn.disabled = false; toast(r.msg); load(); }, function(){ btn.disabled = false; });
}
if (PIN) { go('main'); load(); } else showLogin();
</script>
